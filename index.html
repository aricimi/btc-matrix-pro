<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bitcoin Matrix Pro - Multi-Timeframe Edition</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0f1d">

    <style>
        :root {
            --bg-dark: #0a0f1d;
            --bg-card: #111a2e;
            --bg-card-alt: #1a2642;
            --cyan-glow: #38bdf8;
            --green-glow: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.12);
            --green-border: #16a34a;
            --yellow-glow: #eab308;
            --yellow-bg: rgba(234, 179, 8, 0.12);
            --yellow-border: #ca8a04;
            --red-glow: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.12);
            --red-border: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.2);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; padding: 16px; padding-bottom: 40px; }

        header { text-align: center; margin-bottom: 16px; }
        .app-title { font-size: 1.35rem; font-weight: 800; background: linear-gradient(135deg, #ffffff 0%, var(--cyan-glow) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .live-bar { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .live-item { display: flex; flex-direction: column; }
        .live-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .live-val { font-size: 0.95rem; font-weight: 800; color: var(--cyan-glow); }
        .btn-sync { background: var(--bg-card-alt); border: 1px solid var(--border-color); color: var(--cyan-glow); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

        .card { background: var(--bg-card); border-radius: 16px; padding: 18px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .card-title { font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 8px; }

        .tf-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
        .tf-btn { background: var(--bg-card-alt); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 8px 0; text-align: center; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .tf-btn.active { background: var(--cyan-glow); color: var(--bg-dark); border-color: var(--cyan-glow); }

        .form-group { margin-bottom: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        input, select { width: 100%; background: var(--bg-card-alt); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 10px 12px; color: #ffffff; font-size: 0.9rem; font-weight: 600; outline: none; }

        .btn-calc { width: 100%; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; border: none; padding: 16px; border-radius: 14px; font-size: 1.05rem; font-weight: 800; cursor: pointer; margin-top: 8px; margin-bottom: 20px; }

        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; background: rgba(10, 15, 29, 0.8); padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .metric-box { text-align: center; }
        .metric-label { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .metric-value { font-size: 0.88rem; font-weight: 700; color: var(--cyan-glow); }

        .result-card { border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1.5px solid; }
        .state-green { background: var(--green-bg); border-color: var(--green-border); color: #ffffff; }
        .state-green .res-title { color: var(--green-glow); }
        .state-yellow { background: var(--yellow-bg); border-color: var(--yellow-border); color: #ffffff; }
        .state-yellow .res-title { color: var(--yellow-glow); }
        .state-red { background: var(--red-bg); border-color: var(--red-border); color: #ffffff; }
        .state-red .res-title { color: var(--red-glow); }

        .res-header { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
        .res-title { font-size: 1rem; font-weight: 800; margin-bottom: 6px; }
        .res-message { font-size: 0.85rem; line-height: 1.4; color: #e2e8f0; }

        footer { text-align: center; font-size: 0.7rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="app-title">⚡ BITCOIN MATRIX PRO</div>
            <div class="subtitle">Multi-Timeframe Technical Engine</div>
        </header>

        <div class="live-bar">
            <div class="live-item">
                <span class="live-label">Live BTC Price</span>
                <span class="live-val" id="liveBtc">$0.00</span>
            </div>
            <div class="live-item">
                <span class="live-label">Fear & Greed</span>
                <span class="live-val" id="liveFg">--</span>
            </div>
            <button class="btn-sync" onclick="fetchLiveAPIs()">🔄 Sync</button>
        </div>

        <!-- Timeframe Selector -->
        <div class="card">
            <div class="card-title">1. Execution Timeframe</div>
            <div class="tf-grid">
                <div class="tf-btn" onclick="selectTF(this, '5m')">5M</div>
                <div class="tf-btn" onclick="selectTF(this, '15m')">15M</div>
                <div class="tf-btn active" onclick="selectTF(this, '1h')">1H</div>
                <div class="tf-btn" onclick="selectTF(this, '4h')">4H</div>
                <div class="tf-btn" onclick="selectTF(this, '1d')">1D</div>
            </div>
            <input type="hidden" id="selectedTimeframe" value="1h">
        </div>

        <!-- Technical Structure -->
        <div class="card">
            <div class="card-title">2. Chart Technical Structure</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="priceA">Current Price (A)</label>
                    <input type="number" id="priceA" value="65000" step="any">
                </div>
                <div class="form-group">
                    <label for="pinkB">20 EMA Support (B)</label>
                    <input type="number" id="pinkB" value="64850" step="any">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="yellowC">Resistance / Target (C)</label>
                    <input type="number" id="yellowC" value="66200" step="any">
                </div>
                <div class="form-group">
                    <label for="rsiValue">RSI Indicator (14)</label>
                    <input type="number" id="rsiValue" value="54" min="0" max="100">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="htfTrend">Macro Trend (1D / 4H)</label>
                    <select id="htfTrend">
                        <option value="Bullish" selected>Bullish (Higher Highs)</option>
                        <option value="Neutral">Neutral (Range-bound)</option>
                        <option value="Bearish">Bearish (Lower Lows)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="volumeState">Breakout Volume</label>
                    <select id="volumeState">
                        <option value="High" selected>High (Above Avg)</option>
                        <option value="Low">Low / Weak Volume</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="btn-calc" onclick="runCalculationEngine()">⚡ EVALUATE TECHNICAL MATRIX</button>

        <div id="resultsWrapper" style="display:none;">
            <div class="metrics-grid">
                <div class="metric-box">
                    <div class="metric-label">Timeframe</div>
                    <div class="metric-value" id="valTF">1H</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">RSI Status</div>
                    <div class="metric-value" id="valRsi">Neutral</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Risk/Reward</div>
                    <div class="metric-value" id="valRR">1:2.0</div>
                </div>
            </div>

            <div id="box2" class="result-card state-green">
                <div class="res-header">Execution Signal</div>
                <div class="res-title" id="box2Title">--</div>
                <div class="res-message" id="box2Message">--</div>
            </div>
        </div>

        <footer>
            Multi-Timeframe Decision Engine
        </footer>
    </div>

    <script>
        function selectTF(el, tf) {
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('selectedTimeframe').value = tf;
        }

        async function fetchLiveAPIs() {
            try {
                const btcRes = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
                const btcData = await btcRes.json();
                const currentPrice = parseFloat(btcData.price);
                document.getElementById('liveBtc').innerText = '$' + currentPrice.toLocaleString('en-US', {maximumFractionDigits: 2});
                document.getElementById('priceA').value = currentPrice.toFixed(2);

                const fgRes = await fetch('https://api.alternative.me/fng/');
                const fgData = await fgRes.json();
                document.getElementById('liveFg').innerText = fgData.data[0].value + '/100';
            } catch (err) { console.log(err); }
        }

        function runCalculationEngine() {
            const tf = document.getElementById('selectedTimeframe').value.toUpperCase();
            const priceA = parseFloat(document.getElementById('priceA').value) || 0;
            const pinkB = parseFloat(document.getElementById('pinkB').value) || 1;
            const yellowC = parseFloat(document.getElementById('yellowC').value) || 1;
            const rsi = parseFloat(document.getElementById('rsiValue').value) || 50;
            const htfTrend = document.getElementById('htfTrend').value;
            const volume = document.getElementById('volumeState').value;

            // Risk:Reward calculation
            const risk = Math.abs(priceA - pinkB);
            const reward = Math.abs(yellowC - priceA);
            const rrRatio = risk > 0 ? (reward / risk).toFixed(1) : "0.0";

            document.getElementById('valTF').innerText = tf;
            document.getElementById('valRR').innerText = `1:${rrRatio}`;

            // RSI status check
            let rsiText = "Neutral";
            if (rsi >= 70) rsiText = "Overbought";
            else if (rsi <= 30) rsiText = "Oversold";
            document.getElementById('valRsi').innerText = rsiText;

            const box2 = document.getElementById('box2');
            const box2Title = document.getElementById('box2Title');
            const box2Message = document.getElementById('box2Message');

            // Strategy conditions
            const aboveSupport = priceA > pinkB;
            const goodRR = (reward / risk) >= 1.5;
            const healthyRsi = rsi >= 40 && rsi <= 65;

            if (htfTrend === "Bullish" && aboveSupport && healthyRsi && volume === "High" && goodRR) {
                box2.className = 'result-card state-green';
                box2Title.innerText = `🟢 HIGH-PROBABILITY LONG (${tf})`;
                box2Message.innerText = `Macro trend is Bullish, price sits above support ($${pinkB}), RSI is in healthy momentum range (${rsi}), and volume confirms execution. RR is 1:${rrRatio}.`;
            } else if (rsi >= 70) {
                box2.className = 'result-card state-yellow';
                box2Title.innerText = `⚠️️ OVERBOUGHT TRAP (${tf})`;
                box2Message.innerText = `RSI is at ${rsi} (Overbought). Wait for a pullback to support ($${pinkB}) before entering.`;
            } else if (!aboveSupport || htfTrend === "Bearish") {
                box2.className = 'result-card state-red';
                box2Title.innerText = `🔴 NO SIGNAL / BEARISH ALIGNMENT (${tf})`;
                box2Message.innerText = `Price is below 20 EMA support or the higher timeframe is bearish. Stand down.`;
            } else {
                box2.className = 'result-card state-yellow';
                box2Title.innerText = `🟡 WEAK SETUP / LOW RR (${tf})`;
                box2Message.innerText = `Setup lacks high volume or favorable Risk/Reward (1:${rrRatio}). Wait for cleaner price action.`;
            }

            document.getElementById('resultsWrapper').style.display = 'block';
        }

        window.onload = function() {
            fetchLiveAPIs();
            runCalculationEngine();
        };
    </script>
</body>
</html>
